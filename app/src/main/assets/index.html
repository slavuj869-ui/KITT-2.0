<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KITT 2.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#020203;color:#e5e5e8;font-family:Arial,sans-serif}button{font:inherit;color:inherit;background:linear-gradient(#111,#030303);border:1px solid #54525d;clip-path:polygon(6% 0,94% 0,100% 20%,100% 80%,94% 100%,6% 100%,0 80%,0 20%);padding:14px 7px;min-height:50px}button.active{background:linear-gradient(#74000e,#210006);border-color:#ff2944;box-shadow:inset 0 0 18px #e00028,0 0 12px #e0002855}.app{min-height:100dvh;max-width:1400px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:center;font-size:clamp(17px,3vw,30px)}.top b{font-weight:900}.top em{color:#ff2946;font-style:normal}.scanner{height:48px;border-top:1px solid #55404b;border-bottom:1px solid #a62c41;display:flex;gap:5px;align-items:center;justify-content:center}.lamp{width:7%;max-width:65px;height:23px;background:#70000c;transition:background .09s,box-shadow .09s}.main{display:grid;grid-template-columns:1fr 2.1fr 1fr;gap:12px;align-items:center;flex:1}.panel{padding:18px 14px;border:1px solid #8d3546;background:#050506;clip-path:polygon(5% 0,95% 0,100% 10%,100% 90%,95% 100%,5% 100%,0 90%,0 10%)}.kitt{font-size:clamp(32px,5vw,68px);font-weight:900;color:#ff0926;font-style:italic;text-shadow:0 0 16px #f00028}.sub{color:#bdbdc3;font-size:clamp(13px,2vw,25px);line-height:1.5}.online{color:#30e631;font-size:clamp(19px,3vw,33px);font-weight:bold}.check{color:#29e52d;float:right}.holo{min-height:230px;display:flex;justify-content:center;align-items:center;position:relative;background:radial-gradient(ellipse,#49000c55,transparent 70%)}.holo svg{width:min(100%,420px);height:auto;max-height:44vh;filter:drop-shadow(0 0 8px #f0002d);animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{filter:drop-shadow(0 0 19px #ff244b);transform:translateY(-4px)}}.eq{display:flex;justify-content:center;align-items:end;gap:clamp(9px,2.5vw,30px);height:148px;border-bottom:1px solid #fb1735;padding:0 8px 6px}.eqcol{flex:1;max-width:75px;display:flex;flex-direction:column;align-items:center;gap:4px}.bar{height:16px;width:100%;background:#ff1c3b;box-shadow:0 0 8px #ee002b}.bars{height:112px;width:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:3px}.eqcol span{margin-top:6px}.modes,.nav{display:grid;gap:8px}.modes{grid-template-columns:repeat(4,1fr)}.nav{grid-template-columns:repeat(5,1fr);margin-top:auto;border-top:1px solid #36303b;padding-top:12px}.nav button{font-size:clamp(11px,2vw,20px)}.nav .symbol{display:block;font-size:25px;margin-bottom:4px}.controls{display:flex;justify-content:center;gap:10px}.controls button{min-width:140px}.hint{text-align:center;color:#a3a3ad;font-size:12px;min-height:16px}@media(max-width:650px){.app{gap:8px;padding:8px}.main{grid-template-columns:1fr 1fr}.holo{grid-column:1/-1;grid-row:1;min-height:200px}.holo svg{max-height:34vh}.panel{padding:9px}.panel:first-child{grid-column:1}.panel:last-child{grid-column:2}.eq{height:118px}.bars{height:83px}.bar{height:11px}.modes button{font-size:12px;min-height:42px}.nav button{padding:9px 1px}.nav .symbol{font-size:21px}}@media(orientation:landscape) and (max-height:600px){.app{gap:4px}.scanner{height:25px}.lamp{height:14px}.main{grid-template-columns:1fr 2fr 1fr}.holo{grid-column:auto;grid-row:auto;min-height:90px}.holo svg{max-height:28vh}.eq{height:65px}.bars{height:42px}.bar{height:5px}.controls button,.modes button,.nav button{min-height:30px;padding:5px}.nav .symbol{font-size:16px}.panel{padding:8px}.top{font-size:16px}}
body[data-mode="classic"] .holo svg{filter:drop-shadow(0 0 3px #f0002d);animation:none}body[data-mode="spectrum"] .holo{opacity:.25}body[data-mode="spectrum"] .eq{height:190px}body[data-mode="text"] .holo svg{display:none}body[data-mode="text"] .holo::after{content:"KITT VOICE BOX\\A SYSTEM ONLINE";white-space:pre;text-align:center;color:#ff244b;font-size:clamp(18px,4vw,38px);font-weight:900;letter-spacing:.12em;text-shadow:0 0 16px #f0002d}button:focus-visible{outline:2px solid #fff;outline-offset:3px}@media(prefers-reduced-motion:reduce){.holo svg{animation:none!important}.lamp{transition:none}}@media(orientation:landscape) and (max-height:600px){body[data-mode="spectrum"] .eq{height:80px}}
.holo{perspective:850px;transform-style:preserve-3d;overflow:hidden}.holo svg{will-change:transform;animation:orbit3d 10s ease-in-out infinite!important}@keyframes orbit3d{0%,100%{transform:translate3d(0,0,0) rotateY(-8deg) rotateX(4deg) scale(.98)}25%{transform:translate3d(7px,-5px,12px) rotateY(8deg) rotateX(-5deg) scale(1.02)}50%{transform:translate3d(0,3px,24px) rotateY(10deg) rotateX(3deg) scale(1.05)}75%{transform:translate3d(-8px,-4px,8px) rotateY(-6deg) rotateX(-6deg) scale(.99)}}body[data-mode="classic"] .holo svg,body[data-motion="off"] .holo svg{animation:none!important;transform:none!important}.holo:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 7px,#ff335507 8px 9px)}.mission{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:680px;margin:auto;padding:18px;background:#0a0308;border:1px solid #ff284c;box-shadow:0 0 40px #e0002855;display:none}.mission.visible{display:block}.mission h2{color:#ff3558}.mission .actions{display:flex;flex-wrap:wrap;gap:8px}.mission .actions button{flex:1;min-width:120px}.mission .close{float:right}.metric{font-size:clamp(24px,5vw,42px);font-weight:900;color:#ff3558}@media(prefers-reduced-motion:reduce){.holo svg{animation:none!important;transform:none!important}}.holo{isolation:isolate}.holo::before{content:"";position:absolute;z-index:-1;width:min(86%,360px);aspect-ratio:1;border-radius:50%;border:1px solid #ff244b33;box-shadow:0 0 28px #ff17351c,inset 0 0 30px #ff17351a;background:repeating-radial-gradient(circle,transparent 0 24px,#ff244b12 25px 26px,transparent 27px 48px);transform:rotateX(65deg) translateY(35px);animation:orbitRing 12s linear infinite}.holo svg{backface-visibility:visible}.holo::after{z-index:2}.panel{position:relative}.panel::before{content:"";position:absolute;top:0;left:12%;width:35%;height:2px;background:#ff3153;box-shadow:0 0 10px #ff3153}.scanner{position:relative;overflow:hidden}.scanner::before,.scanner::after{content:"";position:absolute;width:12px;height:3px;background:#ff2348;top:0;box-shadow:0 0 9px #ff2348}.scanner::before{left:0}.scanner::after{right:0}@keyframes orbitRing{50%{transform:rotateX(65deg) rotateZ(180deg) translateY(35px)}to{transform:rotateX(65deg) rotateZ(360deg) translateY(35px)}}@media(prefers-reduced-motion:reduce){.holo::before{animation:none!important}}body[data-motion="off"] .holo::before{animation:none!important}
/* Respect motion preferences for every decorative animation, including depth rings. */
@media(prefers-reduced-motion:reduce){.holo::before,.holo svg,.holo svg g{animation:none!important;transition:none!important;transform:none!important}}
/* Keep the mission console reachable on compact landscape displays. */
.mission{max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
@media(orientation:landscape) and (max-height:450px){.mission{top:6px;bottom:6px;max-height:calc(100dvh - 12px);padding:9px 14px}.mission h2{font-size:16px;margin:3px 0}.mission p{margin:5px 0}.mission .actions button{min-height:34px;padding:5px}}
</style></head><body><div class="app"><header class="top"><b>KITT COCKPIT <em>2.0</em></b><span id="clock"></span></header><div class="scanner" id="scanner" aria-hidden="true"></div><section class="main"><div class="panel"><div class="kitt">KITT</div><div class="sub">VOICE BOX<br>(HOLOGRAMVY)</div></div><div class="holo"><svg viewBox="0 0 420 430" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="red"><stop stop-color="#8a001a" stop-opacity=".3"/><stop offset="1" stop-color="#100005" stop-opacity=".05"/></radialGradient></defs><g fill="none" stroke="#f5143a" stroke-width="1.4"><ellipse cx="210" cy="385" rx="187" ry="26" opacity=".55"/><ellipse cx="210" cy="385" rx="145" ry="16" opacity=".7"/><path d="M130 322 Q132 354 112 366 Q210 411 308 366 Q288 354 290 322" fill="url(#red)"/><path d="M210 28 C140 27 115 79 120 157 L122 226 Q128 288 167 319 Q210 351 253 319 Q292 286 298 226 L300 155 C303 80 277 28 210 28Z" fill="url(#red)" stroke-width="3"/><path d="M120 175 Q100 165 108 212 Q115 244 129 240 M300 175 Q320 165 312 212 Q305 244 291 240"/><path d="M210 30 L210 344 M166 40 Q149 182 165 318 M255 40 Q271 182 255 318 M135 73 Q165 100 210 97 Q255 100 285 73 M122 128 Q165 142 210 140 Q255 142 298 128 M120 176 Q160 185 210 185 Q260 185 300 176 M130 244 Q165 257 210 257 Q255 257 290 244 M155 300 Q210 314 265 300 M145 51 Q185 63 210 62 Q235 63 275 51 M133 93 Q210 110 287 93 M125 216 Q210 229 295 216"/><path d="M133 173 Q160 154 192 174 Q165 195 133 173 M228 174 Q260 154 287 173 Q260 195 228 174 M195 170 L210 191 L225 170 M207 185 L194 241 Q210 253 226 241 L213 185 M174 280 Q210 267 246 280 Q210 291 174 280 M181 286 Q210 300 239 286"/><path d="M143 90 Q170 190 143 269 M277 90 Q250 190 277 269 M163 70 Q190 170 176 262 M257 70 Q230 170 244 262 M132 323 Q210 357 288 323" opacity=".65"/></g></svg></div><div class="panel"><div class="sub">STATUS</div><div class="online">ONLINE</div><hr style="border-color:#333"><div class="sub">AUDIO <span class="check" id="audioStatus" aria-live="polite">DEMO</span><br>SYSTEM <span class="check">✓</span><br>MODULER <span class="check" style="color:#ffcc55">PÅGÅR</span></div></div></section><div class="eq" id="eq" aria-label="Sex kanaler för ljudnivå"></div><div class="controls"><button id="mic">STARTA LJUD</button><button id="demo" class="active">DEMO PÅ</button></div><div class="hint" id="hint">Demoläge • mikrofon kräver tillstånd</div><div class="modes"><button>KLASSISK</button><button class="active">HOLOGRAM</button><button>SPEKTRUM</button><button>TEXT</button></div><nav class="nav"><button><span class="symbol">🚘</span>BIL</button><button class="active"><span class="symbol">▥</span>VB</button><button><span class="symbol">▦</span>MODULER</button><button><span class="symbol">➤</span>NAV</button><button><span class="symbol">⚙</span>INSTÄLLNINGAR</button></nav><section class="mission" id="mission" role="dialog" aria-label="KITT kontrollpanel"><button id="closeMission" class="close">STÄNG ✕</button><h2 id="missionTitle"></h2><div id="missionBody"></div><div class="actions" id="missionActions"></div></section></div><script>
const scanner=document.getElementById('scanner'),eq=document.getElementById('eq'),hint=document.getElementById('hint');let scannerSpeed=1,scannerEnabled=true,headMotion=true;try{const settings=JSON.parse(localStorage.getItem('kitt2.controls')||'{}');if(Number.isFinite(settings.scannerSpeed))scannerSpeed=Math.max(.25,Math.min(3,settings.scannerSpeed));if(typeof settings.scannerEnabled==='boolean')scannerEnabled=settings.scannerEnabled;if(typeof settings.headMotion==='boolean')headMotion=settings.headMotion}catch(_){}document.body.dataset.motion=headMotion?'on':'off';function saveControls(){try{localStorage.setItem('kitt2.controls',JSON.stringify({scannerSpeed,scannerEnabled,headMotion}))}catch(_){}}let phase=0,audioPhase=0,demo=true,analyser=null,stream=null,ctx=null,frame=0,audioGeneration=0,micPending=false;const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');const allowedModes=['classic','hologram','spectrum','text'];let savedMode='hologram';try{const stored=localStorage.getItem('kitt2.displayMode');if(allowedModes.includes(stored))savedMode=stored}catch(_){}document.body.dataset.mode=savedMode;
for(let i=0;i<11;i++){const e=document.createElement('div');e.className='lamp';scanner.appendChild(e)}
for(let i=0;i<6;i++){const c=document.createElement('div');c.className='eqcol';const b=document.createElement('div');b.className='bars';for(let j=0;j<6;j++){let e=document.createElement('div');e.className='bar';b.appendChild(e)}c.appendChild(b);const s=document.createElement('span');s.textContent='V'+(i+1);c.appendChild(s);eq.appendChild(c)}
function updateAudioStatus(){const status=document.getElementById('audioStatus');status.textContent=stream?'LIVE':micPending?'VÄNTAR':demo?'DEMO':'AV';status.style.color=stream?'#29e52d':micPending?'#ffcc55':'#a3a3ad'}
function tick(){if(document.hidden){frame=0;return}if(reducedMotion.matches){frame=0;return}phase+=.06375*scannerSpeed;audioPhase+=.06375;let pos=5+5*Math.sin(phase);[...scanner.children].forEach((e,i)=>{let v=scannerEnabled?Math.max(0,1-Math.abs(i-pos)/2):0;e.style.background=v>.8?'#fff3f5':v>.3?'#ff1235':'#77000c';e.style.boxShadow='0 0 '+(v*23)+'px #ff1235';e.style.opacity=.25+.75*v});let bins=null;if(analyser){bins=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(bins)}[...eq.children].forEach((c,i)=>{let level=demo?Math.round(1+5*Math.abs(Math.sin(audioPhase*(1.2+i*.17)+i))):bins?Math.round(1+5*Math.min(1,bins[Math.floor((i+1)*bins.length/18)]/170)):0;[...c.firstChild.children].forEach((b,j)=>b.style.opacity=j<level?'1':'.06')});frame=requestAnimationFrame(tick)}tick();
document.getElementById('clock').textContent=new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'}),30000);
document.getElementById('demo').onclick=e=>{const enable=!demo;if(enable&&(stream||micPending))releaseAudio();demo=enable;e.target.textContent=demo?'DEMO PÅ':'DEMO AV';e.target.classList.toggle('active',demo);hint.textContent=demo?'Simulerat ljud aktivt':'Demoljud avstängt';updateAudioStatus()};
document.getElementById('mic').onclick=async e=>{if(micPending){audioGeneration++;micPending=false;e.target.textContent='STARTA LJUD';hint.textContent='Mikrofonstart avbruten';return}if(stream){releaseAudio();hint.textContent='Mikrofon avstängd';return}const generation=++audioGeneration;micPending=true;e.target.textContent='AVBRYT START';updateAudioStatus();try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Mikrofonåtkomst stöds inte');const acquired=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});if(generation!==audioGeneration||document.hidden){acquired.getTracks().forEach(t=>t.stop());return}micPending=false;stream=acquired;stream.getAudioTracks().forEach(track=>track.addEventListener('ended',()=>{if(stream===acquired){releaseAudio();hint.textContent='Mikrofonanslutningen avslutades'}}));ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();if(generation!==audioGeneration||document.hidden){releaseAudio();return}const source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=512;source.connect(analyser);demo=false;document.getElementById('demo').classList.remove('active');document.getElementById('demo').textContent='DEMO AV';e.target.textContent='STOPPA LJUD';hint.textContent='Mikrofon aktiv – ljud analyseras lokalt';updateAudioStatus()}catch(err){if(generation===audioGeneration){releaseAudio();hint.textContent='Mikrofonen kunde inte startas: '+err.message}}finally{if(generation===audioGeneration){micPending=false;updateAudioStatus()}}};
document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('active',({KLASSISK:'classic',HOLOGRAM:'hologram',SPEKTRUM:'spectrum',TEXT:'text'})[b.textContent.trim()]===savedMode));
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.body.dataset.mode=({KLASSISK:'classic',HOLOGRAM:'hologram',SPEKTRUM:'spectrum',TEXT:'text'})[b.textContent.trim()]||'hologram';try{localStorage.setItem('kitt2.displayMode',document.body.dataset.mode)}catch(_){}hint.textContent='Visningsläge: '+b.textContent});
const mission=document.getElementById('mission'),missionTitle=document.getElementById('missionTitle'),missionBody=document.getElementById('missionBody'),missionActions=document.getElementById('missionActions'),navButtons=[...document.querySelectorAll('.nav button')];function action(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;missionActions.appendChild(b)}function closeMission(){mission.classList.remove('visible');navButtons.forEach((b,i)=>b.classList.toggle('active',i===1));hint.textContent='Voice Box aktiv'}document.getElementById('closeMission').onclick=closeMission;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mission.classList.contains('visible'))closeMission()});function showMission(page){mission.classList.add('visible');missionActions.replaceChildren();navButtons.forEach((b,i)=>b.classList.toggle('active',['car','vb','modules','nav','settings'][i]===page));if(page==='car'){missionTitle.textContent='KITT // VEHICLE';missionBody.innerHTML='<p>SIMULERAD TELEMETRI · ingen bilanslutning</p><div class="metric" id="metric">088 km/h</div>';let speed=88;const update=()=>document.getElementById('metric').textContent=String(speed).padStart(3,'0')+' km/h';action('ACCELERERA',()=>{speed=Math.min(240,speed+10);update()});action('BROMSA',()=>{speed=Math.max(0,speed-10);update()});action('RESET',()=>{speed=88;update()})}else if(page==='modules'){missionTitle.textContent='KITT // MODULER';missionBody.innerHTML='<p>Kontrollera visuella system</p>';action('SCANNER '+(scannerEnabled?'PÅ':'AV'),()=>{scannerEnabled=!scannerEnabled;saveControls();showMission(page)});action('HOLOGRAM '+(headMotion?'3D':'STATISK'),()=>{headMotion=!headMotion;document.body.dataset.motion=headMotion?'on':'off';saveControls();showMission(page)});action('LJUSBOOST',()=>{document.querySelector('.holo svg').style.filter='drop-shadow(0 0 28px #ff355b)';hint.textContent='Hologram: ljusboost aktiverad'})}else if(page==='nav'){missionTitle.textContent='KITT // NAV';missionBody.innerHTML='<p>Simulerad navigationskompass · ingen GPS-anslutning</p><div class="metric" id="metric">N 000°</div>';let heading=0;const update=()=>document.getElementById('metric').textContent=String(heading).padStart(3,'0')+'°';action('◀ VÄNSTER',()=>{heading=(heading+345)%360;update()});action('HÖGER ▶',()=>{heading=(heading+15)%360;update()});action('NORD',()=>{heading=0;update()})}else if(page==='settings'){missionTitle.textContent='KITT // INSTÄLLNINGAR';missionBody.textContent='Scanner: '+scannerSpeed.toFixed(2)+'× · Hologram: '+(headMotion?'3D':'statiskt');action('HASTIGHET −',()=>{scannerSpeed=Math.max(.25,scannerSpeed-.25);saveControls();showMission(page)});action('HASTIGHET +',()=>{scannerSpeed=Math.min(3,scannerSpeed+.25);saveControls();showMission(page)});action('3D AV/PÅ',()=>{headMotion=!headMotion;document.body.dataset.motion=headMotion?'on':'off';saveControls();showMission(page)});action('STANDARD',()=>{scannerSpeed=1;headMotion=true;scannerEnabled=true;document.body.dataset.motion='on';saveControls();showMission(page)})}}navButtons.forEach((b,i)=>b.onclick=()=>{let page=['car','vb','modules','nav','settings'][i];if(page==='vb')closeMission();else showMission(page)});
function releaseAudio(){audioGeneration++;micPending=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}analyser=null;if(ctx){const closing=ctx;ctx=null;closing.close().catch(()=>{})}document.getElementById('mic').textContent='STARTA LJUD';updateAudioStatus()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(frame)cancelAnimationFrame(frame);frame=0;releaseAudio();hint.textContent='Ljud stoppat när appen lämnades'}else if(!frame&&!reducedMotion.matches){tick()}});
function applyMotionPreference(){if(reducedMotion.matches){if(frame)cancelAnimationFrame(frame);frame=0;[...scanner.children].forEach((lamp,i)=>{lamp.style.background=scannerEnabled&&i===5?'#ff1235':'#350009';lamp.style.boxShadow='none';lamp.style.opacity='1'});[...eq.children].forEach(col=>[...col.firstChild.children].forEach((bar,i)=>bar.style.opacity=i<2?'1':'.06'))}else if(!document.hidden&&!frame)tick()};reducedMotion.addEventListener('change',applyMotionPreference);if(reducedMotion.matches)applyMotionPreference();updateAudioStatus();window.addEventListener('pagehide',()=>{if(frame)cancelAnimationFrame(frame);frame=0;releaseAudio()});window.addEventListener('pageshow',()=>{if(!document.hidden&&!reducedMotion.matches&&!frame)tick()});</script></body></html>
