name: Build and test KITT 2.0 APK
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK missing from GitHub runner}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and run unit tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Validate bundled dashboard features
        shell: bash
        run: |
          set -euo pipefail
          HTML="app/src/main/assets/index.html"
          test -s "$HTML"
          grep -q 'id="scanner"' "$HTML"
          grep -q 'id="eq"' "$HTML"
          grep -q 'id="mission"' "$HTML"
          grep -q 'orbit3d' "$HTML"
          grep -q 'scannerSpeed' "$HTML"
          grep -q 'showMission(page)' "$HTML"
          grep -q 'SIMULERAD TELEMETRI' "$HTML"
          grep -q 'SIMULERAD TELEMETRI\|Simulerad navigationskompass' "$HTML"
          grep -q 'enableImmersiveMode' app/src/main/java/se/kitt/cockpit2/MainActivity.java
          grep -q 'SYSTEM_UI_FLAG_HIDE_NAVIGATION' app/src/main/java/se/kitt/cockpit2/MainActivity.java
          grep -q 'data-mode' "$HTML"
          grep -q 'navigator.mediaDevices.getUserMedia' "$HTML"
          grep -q 'STATUS' "$HTML"
          grep -q 'audioGeneration++' "$HTML"
          grep -q 'generation!==audioGeneration||document.hidden' "$HTML"
          ! grep -Eiq '>TALA<|>LYSSNA<' "$HTML"
      - name: Validate dashboard JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.inside=False; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and not dict(attrs).get('src'): self.inside=True
              def handle_endtag(self, tag):
                  if tag == 'script': self.inside=False
              def handle_data(self, data):
                  if self.inside: self.scripts.append(data)
          p=Scripts(); p.feed(Path('app/src/main/assets/index.html').read_text())
          assert p.scripts, 'No inline JavaScript found'
          Path('/tmp/kitt2-dashboard.js').write_text('\n'.join(p.scripts))
          PY
          node --check /tmp/kitt2-dashboard.js
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify "$APK"
          echo "APK archive and signature verified"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KITT-2.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
